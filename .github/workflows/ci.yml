name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
      - run: python tools/check_generic.py
      - name: Pre-registration present for experiment PRs
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'exp/')
        run: |
          git fetch origin main --depth=1
          git diff --name-only origin/main...HEAD | grep -q '^experiments/EXP-' \
            || (echo "Experiment PR without a pre-registration file" && exit 1)
